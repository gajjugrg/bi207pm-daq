name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pywin32 is Windows-only and is only imported inside connect(), which the
      # tests never reach -- everything below the COM boundary runs on a stub.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v -e '^#' -e '^\s*$' -e pywin32 requirements.txt | xargs pip install

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: |
          pip install pyflakes
          python -m pyflakes srcs tests
